# cargo-deny configuration for envelope / postmaster.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Check all features to catch issues in optional dependencies.
all-features = true

[advisories]
# RustSec advisory IDs to ignore (with justification). Keep empty by default.
ignore = [
    # Add entries here only when a legitimate, low-risk advisory affects
    # postmaster's dependency tree and we have a documented reason to ignore it.
    # Example:
    # "RUSTSEC-XXXX-XXXX",  # short justification + link to upstream fix plan
]

[licenses]
# Allowed licenses. Keep this list in sync with what the actual dependency
# tree (postmaster + any future workspace crates) pulls in.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# The postmaster crate is the only member today.
[licenses.private]
ignore = true

[sources]
# The ecies fork in [patch.crates-io] (audit 2026-08-02 A7) is the only
# sanctioned git source; drop this entry together with the patch section
# once the upstream PR ships in a crates.io release.
allow-git = ["https://github.com/beardedeagle/rs.git"]

[bans]
# Warn on duplicate crate versions — companion to clippy's
# multiple_crate_versions (crate-level; allowed at the crate root for
# exactly the case skipped below, since that lint has no per-package
# scoping). New duplicates should fail review, not land quietly.
multiple-versions = "warn"

# syn 2 + syn 3 coexist ONLY because wasm-bindgen (target-gated to
# wasm32-unknown-unknown inside the ecies dep, never compiled for
# postmaster's real targets) pins syn 2 while serde_derive uses syn 3 —
# uncontrollable until upstream wasm-bindgen moves. Remove this skip, and
# the crate-root allow in src/lib.rs, when the tree converges.
skip = [{ name = "syn" }]
