name: Security

# Disabled: GitHub Actions budget exhausted.
# Remove the `if: false` on each job to re-enable.
on:
  schedule:
    # Run daily at 9am UTC
    - cron: '0 9 * * *'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust, just, and cargo-audit
        uses: ./.github/actions/setup-rust
        with:
          install-cargo-audit: "true"

      - name: Security audit
        run: just audit

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust, just, and cargo-deny
        uses: ./.github/actions/setup-rust
        with:
          install-cargo-deny: "true"

      - name: Dependency policy
        run: just deny
