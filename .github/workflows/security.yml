name: Security

on:
  schedule:
    # Run daily at 9am UTC
    - cron: '0 9 * * *'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust, just, and cargo-audit
        uses: ./.github/actions/setup-rust
        with:
          install-cargo-audit: "true"

      - name: Security audit
        run: just audit

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust, just, and cargo-deny
        uses: ./.github/actions/setup-rust
        with:
          install-cargo-deny: "true"

      - name: Dependency policy
        run: just deny
