name: Release request

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  request:
    name: Request release from main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record requested tag and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          REQUEST_PATH: ${{ runner.temp }}/release-request/request.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["REQUEST_PATH"])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["RELEASE_COMMIT"],
          }) + "\n")
          PY
      - name: Upload release request
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-request
          path: ${{ runner.temp }}/release-request/request.json
          if-no-files-found: error
          retention-days: 7
