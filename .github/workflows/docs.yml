name: Docs

# Disabled: GitHub Actions budget exhausted.
# Remove the `if: false` on each job to re-enable.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Nix
        shell: bash
        run: |
          if ! command -v nix >/dev/null 2>&1; then
            curl -sSf -L https://nixos.org/nix/install | sh -s -- install --no-confirm
          fi

      - name: Enable nix-command and flakes
        shell: bash
        run: |
          mkdir -p "$HOME/.config/nix"
          if ! grep -q 'experimental-features' "$HOME/.config/nix/nix.conf" 2>/dev/null; then
            echo 'experimental-features = nix-command flakes' >> "$HOME/.config/nix/nix.conf"
          fi

      - name: Install just
        uses: ./.github/actions/setup-rust

      - name: Build book
        run: just docs
