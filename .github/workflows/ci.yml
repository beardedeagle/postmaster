name: CI

# Disabled: GitHub Actions budget exhausted.
# Remove the `if: false` on each job to re-enable.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: false
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust

      - name: Quality gate (fmt, clippy, build, test)
        run: just ci-rust

# The dependency-policy (cargo deny) job lives in security.yml — do not
# duplicate it here (sweep 2026-08-07 R9).
