name: Nix

# Disabled: GitHub Actions budget exhausted.
# Remove the `if: false` on each job to re-enable.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: flake check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: false
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/setup-nix

      - name: Install just
        uses: ./.github/actions/setup-rust
        with:
          install-cargo-deny: "false"
          install-cargo-audit: "false"

      - name: nix flake check
        run: just flake-check

      - name: nix flake check (eval-only, all systems)
        run: just flake-check-eval-all
