name: Nix

# Disabled: GitHub Actions budget exhausted.
# Remove the `if: false` on each job to re-enable.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: flake check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: false
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: nix flake check
        run: nix flake check

      - name: nix flake check (eval-only, all systems)
        run: nix flake check --all-systems --no-build
